name: Skill integrity

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      evaluation_tools:
        description: Run optional offline evaluation-tool checks (no model calls)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-odai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 25.9.0
      - name: Install runtime build dependencies
        run: npm ci
      - name: Typecheck and build all DSH packages
        run: npm run check:dsh
      - name: Check skill files and loading
        run: node scripts/validate-odai-skill.mjs
      - name: Test repository version policy
        run: |
          npm run test:version-policy
          node scripts/verify-dsh-package-versions.mjs
      - name: Test optional evaluation tools when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluation_tools }}
        run: npm run test:evaluation-tools
      - name: Check standalone routing entrypoints
        run: |
          node --check skills/odai-orchestration/scripts/run-role.mjs
          node --check skills/odai-orchestration/scripts/verify-routing.mjs
      - name: Test hook and routing boundaries
        run: |
          node scripts/test-odai-hooks.mjs
          node scripts/test-odai-routing.mjs
      - name: Test package lifecycle and release guards
        run: node --test scripts/run-package-pack.test.mjs scripts/dsh-publish-entrypoint.test.mjs
      - name: Test built DSH runtime, Plugin, and Agent
        run: |
          npm --prefix dsh/agent install --ignore-scripts --no-package-lock --legacy-peer-deps
          node --test dsh/runtime/tests/*.test.mjs dsh/plugin/tests/*.test.mjs scripts/dsh-web-rpc.test.mjs dsh/agent/tests/*.test.mjs
      - name: Verify isolated DSH release contract
        run: node scripts/verify-dsh-release-matrix.mjs
      - name: Verify packaged artifacts and cleanup
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          npm pack ./dsh/plugin --pack-destination "$scratch"
          npm pack ./dsh/agent --pack-destination "$scratch"
          node scripts/verify-dsh-packed-artifacts.mjs \
            "$scratch"/odai-dsh-plugin-*.tgz \
            "$scratch"/odai-dsh-agent-*.tgz
          test ! -e dsh/plugin/runtime
          test ! -e dsh/plugin/skills
          test ! -e dsh/plugin/client
          test ! -e dsh/agent/preset/odai/runtime
          test ! -e dsh/agent/preset/odai/skills
          test ! -e dsh/agent/client
